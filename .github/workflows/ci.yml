name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # undici 8 は Node 22.10+ の worker_threads.markAsUncloneable に依存するため 22 を使用
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # テストは Electron 本体を起動しないため、バイナリDL(約100MB)を省略して高速化
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Run tests
        run: npm test
